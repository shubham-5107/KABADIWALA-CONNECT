<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabadiwala Connect — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFEBDD;
    --forest:#1F4D3A;
    --forest-dark:#12251C;
    --forest-tint:#E4EDE7;
    --marigold:#E8A93B;
    --marigold-dark:#B5771A;
    --copper:#B5651D;
    --rust:#B23A2E;
    --paper:#FFFDF6;
    --line:#DCD5C1;
    --ink:#192019;
    --muted:#6E6B58;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(31,77,58,0.05) 0, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(232,169,59,0.08) 0, transparent 45%);
    font-family:'Noto Sans','Noto Sans Devanagari',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:28px;
    padding:32px 16px;
    flex-wrap:wrap;
  }
  /* ---------- Phone frame ---------- */
  .phone-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .phone{
    width:280px;
    max-width:94vw;
    height:820px;
    max-height:92vh;
    background:var(--forest-dark);
    border-radius:53px;
    padding:7px;
    box-shadow:0 30px 60px rgba(18,37,28,0.35), 0 2px 0 rgba(255,255,255,0.4) inset;
    position:relative;
  }
  .screen{
    background:var(--paper);
    width:100%;
    height:100%;
    border-radius:50px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .notch{
    position:absolute;
    top:14px;left:50%;transform:translateX(-50%);
    width:80px;height:25px;background:var(--forest-dark);
    border-radius: 100px;z-index:5;
  }
  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--forest);
    color:#fff;
    padding:40px 16px 14px;
    flex-shrink:0;
  }
  .topbar-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-mark{
    width:40px;height:40px;border-radius:9px;background:var(--marigold);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
  }
  .brand-name{font-weight:800;font-size:15px;line-height:1.1;}
  .brand-name small{display:block;font-weight:400;font-size:10.5px;color:#CFE0D6;margin-top:1px;}
  .lang-switch{display:flex;background:rgba(255,255,255,0.12);border-radius:20px;padding:3px;gap:2px;}
  .lang-switch button{
    border:none;background:transparent;color:#CFE0D6;font-weight:700;font-size:11px;
    padding:5px 9px;border-radius:16px;cursor:pointer;font-family:inherit;
  }
  .lang-switch button.active{background:var(--marigold);color:var(--forest-dark);}
  .conn-row{
    margin-top:12px;display:flex;align-items:center;justify-content:space-between;
    background:rgba(255,255,255,0.1);border-radius:12px;padding:8px 10px;
  }
  .conn-left{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.on{background:#7FD99A;box-shadow:0 0 0 3px rgba(127,217,154,0.25);}
  .dot.off{background:#E8896B;box-shadow:0 0 0 3px rgba(232,137,107,0.25);}
  .toggle{
    width:42px;height:24px;border-radius:14px;background:rgba(255,255,255,0.25);
    position:relative;cursor:pointer;flex-shrink:0;transition:background .2s;
  }
  .toggle.on{background:var(--marigold);}
  .toggle-knob{
    position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
    background:#fff;transition:left .2s;
  }
  .toggle.on .toggle-knob{left:20px;}
  .sync-note{font-size:10.5px;color:#CFE0D6;margin-top:6px;}
  /* ---------- Main view ---------- */
  .view{flex:1;overflow-y:auto;padding:16px 16px 90px;}
  .view::-webkit-scrollbar{width:0;}
  .greet{font-size:19px;font-weight:800;margin:2px 0 2px;}
  .subgreet{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
  .banner{
    display:flex;gap:10px;align-items:flex-start;
    background:#FBEDE3;border:1px solid #F0CBAE;border-radius:12px;
    padding:10px 12px;margin-bottom:16px;font-size:12px;color:#7A4420;
  }
  .banner.good{background:var(--forest-tint);border-color:#BFDACB;color:var(--forest);}
  .primary-card{
    background:var(--forest);color:#fff;border-radius:20px;padding:18px;
    display:flex;align-items:center;gap:14px;cursor:pointer;margin-bottom:14px;
    box-shadow:0 10px 24px rgba(31,77,58,0.25);
  }
  .primary-card .icon{
    width:52px;height:52px;border-radius:14px;background:var(--marigold);
    display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;
  }
  .primary-card .txt b{display:block;font-size:16px;margin-bottom:2px;}
  .primary-card .txt span{font-size:12px;color:#CFE0D6;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:16px;
    padding:14px 12px;cursor:pointer;text-align:left;transition:transform .1s;
  }
  .card:active{transform:scale(0.97);}
  .card .icon{
    width:38px;height:38px;border-radius:10px;background:var(--forest-tint);
    display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:8px;
  }
  .card b{font-size:12.5px;display:block;}
  .strip{
    display:flex;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  }
  .strip>div{flex:1;padding:12px;text-align:center;}
  .strip>div:first-child{border-right:1px solid var(--line);}
  .strip .amt{font-size:16px;font-weight:800;color:var(--forest);}
  .strip .lab{font-size:10.5px;color:var(--muted);margin-top:2px;}
  h2.sec{font-size:15px;font-weight:800;margin:20px 0 10px;}
  /* buttons */
  .btn{
    display:block;width:100%;text-align:center;border:none;border-radius:14px;
    padding:14px;font-weight:700;font-size:14.5px;font-family:inherit;cursor:pointer;
  }
  .btn-primary{background:var(--marigold);color:var(--forest-dark);}
  .btn-outline{background:transparent;border:1.5px solid var(--forest);color:var(--forest);}
  .btn-ghost{background:var(--forest-tint);color:var(--forest);}
  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .back-btn{
    width:32px;height:32px;border-radius:9px;background:var(--forest-tint);color:var(--forest);
    display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;font-weight:800;
  }
  .back-row h1{font-size:16px;font-weight:800;margin:0;}
  /* new lot form */
  .step-label{font-size:11.5px;font-weight:700;color:var(--copper);text-transform:none;margin:16px 0 8px;}
  .photo-box{
    border:2px dashed var(--line);border-radius:16px;height:150px;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
    color:var(--muted);font-size:12px;cursor:pointer;overflow:hidden;position:relative;background:#FBF9F2;
  }
  .photo-box img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .photo-box .plus{font-size:26px;}
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .cat-opt{
    border:1.5px solid var(--line);border-radius:14px;padding:11px;text-align:left;
    cursor:pointer;background:var(--paper);font-family:inherit;
  }
  .cat-opt .em{font-size:19px;margin-bottom:5px;display:block;}
  .cat-opt b{font-size:11.5px;line-height:1.25;display:block;}
  .cat-opt .rate{font-size:10.5px;color:var(--muted);margin-top:3px;}
  .cat-opt.sel{border-color:var(--forest);background:var(--forest-tint);}
  .pill-row{display:flex;gap:8px;}
  .pill{
    flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;
    text-align:center;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--paper);color:var(--muted);
  }
  .pill.sel{border-color:var(--marigold-dark);background:var(--marigold);color:var(--forest-dark);}
  .stepper{display:flex;align-items:center;gap:14px;justify-content:center;margin:6px 0 4px;}
  .stepper button{
    width:44px;height:44px;border-radius:50%;border:1.5px solid var(--forest);background:var(--forest-tint);
    color:var(--forest);font-size:20px;font-weight:800;cursor:pointer;
  }
  .stepper .val{font-size:24px;font-weight:800;min-width:70px;text-align:center;}
  .est-box{
    background:var(--forest);color:#fff;border-radius:16px;padding:16px;text-align:center;margin:16px 0;
  }
  .est-box .amt{font-size:30px;font-weight:800;color:var(--marigold);}
  .est-box .formula{font-size:10.5px;color:#CFE0D6;margin-top:4px;}
  /* status chips */
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;}
  .chip.queued{background:#FBEDE3;color:#95502A;}
  .chip.listed{background:#EAF1E7;color:var(--forest);}
  .chip.confirmed{background:#E0EEFB;color:#2A5B95;}
  .chip.paid{background:#E3F4E3;color:#237A33;}
  .lot-row{
    display:flex;align-items:center;gap:11px;background:var(--paper);border:1px solid var(--line);
    border-radius:14px;padding:11px;margin-bottom:9px;cursor:pointer;
  }
  .lot-row .em{width:38px;height:38px;border-radius:10px;background:var(--forest-tint);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .lot-row .mid{flex:1;min-width:0;}
  .lot-row .mid b{font-size:12.5px;display:block;}
  .lot-row .mid span{font-size:10.5px;color:var(--muted);}
  .lot-row .amt{font-size:13px;font-weight:800;color:var(--forest);white-space:nowrap;}
  .empty{text-align:center;padding:40px 10px;color:var(--muted);font-size:12.5px;}
  .empty .em{font-size:34px;display:block;margin-bottom:8px;}
  /* record detail */
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .kv b{color:var(--muted);font-weight:600;}
  .kv span{font-weight:700;text-align:right;}
  .ref-box{
    background:var(--forest-tint);border:1px dashed var(--forest);border-radius:14px;
    padding:14px;text-align:center;margin-bottom:16px;
  }
  .ref-box .ref{font-size:16px;font-weight:800;color:var(--forest);letter-spacing:0.5px;}
  .ref-box small{color:var(--muted);font-size:10.5px;}
  .stepper-status{display:flex;justify-content:space-between;margin:18px 0;position:relative;}
  .stepper-status::before{
    content:"";position:absolute;top:11px;left:24px;right:24px;height:2px;background:var(--line);z-index:0;
  }
  .stepper-status .st{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;position:relative;z-index:1;}
  .stepper-status .dotc{width:22px;height:22px;border-radius:50%;background:var(--line);border:3px solid var(--paper);}
  .stepper-status .st.done .dotc{background:var(--forest);}
  .stepper-status .st span{font-size:9px;color:var(--muted);text-align:center;font-weight:700;}
  /* price board */
  .price-row{
    display:flex;align-items:center;gap:11px;background:var(--paper);border:1px solid var(--line);
    border-radius:14px;padding:11px;margin-bottom:9px;
  }
  .price-row .em{font-size:20px;}
  .price-row .mid{flex:1;}
  .price-row .mid b{font-size:12.5px;display:block;}
  .price-row .mid .trend{font-size:10.5px;font-weight:700;}
  .trend.up{color:#237A33;} .trend.down{color:var(--rust);}
  .price-row .rate{font-size:14px;font-weight:800;color:var(--forest);}
  .listen{
    width:30px;height:30px;border-radius:50%;background:var(--forest-tint);border:none;
    color:var(--forest);font-size:13px;cursor:pointer;flex-shrink:0;
  }
  /* safety */
  .safety-card{
    background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px;
    display:flex;gap:12px;
  }
  .safety-card .em{font-size:26px;flex-shrink:0;}
  .safety-card b{font-size:13px;display:block;margin-bottom:3px;}
  .safety-card p{font-size:11.5px;color:var(--muted);margin:0 0 8px;line-height:1.4;}
  /* recycler */
  .stat-strip{display:flex;gap:9px;margin-bottom:16px;}
  .stat-strip>div{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center;}
  .stat-strip .n{font-size:17px;font-weight:800;color:var(--forest);}
  .stat-strip .l{font-size:9.5px;color:var(--muted);margin-top:2px;}
  .offer-input{
    width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;
    font-family:inherit;margin:8px 0;font-weight:700;color:var(--forest);
  }
  /* bottom nav */
  .bottomnav{
    display:flex;background:var(--paper);border-top:1px solid var(--line);
    padding:9px 6px 12px;position:absolute;bottom:0;left:0;right:0;
  }
  .navbtn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;cursor:pointer;font-family:inherit;color:var(--muted);
  }
  .navbtn .em{font-size:18px;}
  .navbtn span{font-size:9.5px;font-weight:700;}
  .navbtn.active{color:var(--forest);}
  .navbtn.active .em{transform:translateY(-1px);}
  /* demo controls (outside phone) */
  .controls{
    width:260px;max-width:90vw;background:var(--paper);border:1px solid var(--line);
    border-radius:18px;padding:18px;
  }
  .controls h3{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin:0 0 12px;font-weight:800;}
  .controls .grp{margin-bottom:16px;}
  .controls .grp>label{font-size:11px;font-weight:700;color:var(--ink);display:block;margin-bottom:7px;}
  .role-btn{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 11px;
    margin-bottom:7px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;color:var(--ink);
  }
  .role-btn.active{border-color:var(--forest);background:var(--forest-tint);color:var(--forest);}
  .reset-btn{
    width:100%;border:1.5px solid var(--rust);color:var(--rust);background:transparent;border-radius:10px;
    padding:9px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .controls p.note{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:14px;}
  @media(max-width:760px){
    body{align-items:center;}
    .controls{order:2;}
  }
</style>
</head>
<body>

<div class="phone-wrap">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="topbar" id="topbar"></div>
      <div class="view" id="view"></div>
      <div class="bottomnav" id="bottomnav"></div>
    </div>
  </div>
</div>

<div class="controls">
  <h3 id="ctrlTitle">Demo controls</h3>
  <div class="grp">
    <label id="ctrlPerspective">Perspective</label>
    <button class="role-btn" id="roleCollectorBtn">👤 <span>Collector app</span></button>
    <button class="role-btn" id="roleRecyclerBtn">🏭 <span>Recycler portal</span></button>
  </div>
  <button class="reset-btn" id="resetBtn">↺ Reset demo data</button>
  <p class="note" id="ctrlNote">This panel simulates two separate real-world apps sharing one backend. In production, the collector app and recycler portal run on different devices — here both read the same local data store so you can demo the full loop live.</p>
</div>

  {id:"cable", em:"🧵", rate:140, en:"Cables & Wires", hi:"केबल और तार", mr:"केबल आणि तारा", trend:"up"},
  {id:"battery", em:"🔋", rate:85, en:"Batteries", hi:"बैटरी", mr:"बॅटरी", trend:"down"},
  {id:"crt", em:"📺", rate:12, en:"CRT (Old TV)", hi:"सीआरटी (पुराना टीवी)", mr:"सीआरटी (जुना टीव्ही)", trend:"down"},
  {id:"lcd", em:"🖥️", rate:45, en:"LCD/LED Panel", hi:"एलसीडी पैनल", mr:"एलसीडी पॅनेल", trend:"up"},
  {id:"motor", em:"🧲", rate:190, en:"Motors & Magnets", hi:"मोटर और मैग्नेट", mr:"मोटर आणि मॅग्नेट", trend:"up"},
  {id:"plastic", em:"♻️", rate:18, en:"Mixed Plastic", hi:"मिश्रित प्लास्टिक", mr:"संमिश्र प्लास्टिक", trend:"down"},
];
const CONDITIONS = [{id:"good",mult:1.0},{id:"damaged",mult:0.8},{id:"mixed",mult:0.65}];
const COLLECTOR_NAME = "SCHNELL SQUAD";
const RECYCLER = {name:"GreenLoop Recyclers", area:"Nagpur, MH", cpcb:"CPCB/MH/2024/0417"};
const FALLBACK_GEO = {lat:21.1458, lng:79.0882}; // JNARDDC, Nagpur

/* ============ State ============ */
let S = { lang:"en", role:"collector", online:true, view:"home", draft:null, openLotId:null, subview:"lots" };

/* ============ Storage ============ */
function loadLots(){ try{ return JSON.parse(localStorage.getItem("kw_lots")||"[]"); }catch(e){ return []; } }
function saveLots(l){ localStorage.setItem("kw_lots", JSON.stringify(l)); }

function seedIfEmpty(force){
  if(!force && loadLots().length) return;
  const now = Date.now();
  const seed = [
    mkLot("cable", "good", 4.2, "listed", now-1000*60*60*20),
    mkLot("battery", "mixed", 2.5, "confirmed", now-1000*60*60*30),
    mkLot("pcb", "good", 1.1, "paid", now-1000*60*60*70),
  ];
  saveLots(seed);
}
function mkLot(catId, condId, weight, status, ts){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const cond = CONDITIONS.find(c=>c.id===condId);
  const est = Math.round(cat.rate*weight*cond.mult);
  const jitter = ()=> (Math.random()-0.5)*0.01;
  return {
    id: "KC-"+ts.toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,5).toUpperCase(),
    catId, condId, weight, est,
    offer: status!=="listed" ? est + Math.round(est*0.03) : null,
    status, photo:null,
    ts, geo:{lat:FALLBACK_GEO.lat+jitter(), lng:FALLBACK_GEO.lng+jitter()},
    recycler: status==="listed" ? null : RECYCLER.name,
    confirmedTs: status==="confirmed"||status==="paid" ? ts+1000*60*40 : null,
    paidTs: status==="paid" ? ts+1000*60*60*5 : null,
  };
}

/* ============ Helpers ============ */
function t(key){ return STR[S.lang][key]; }
function fmtMoney(n){ return "₹"+Number(n).toLocaleString("en-IN"); }
function fmtTs(ts){ return new Date(ts).toLocaleString(S.lang==="en"?"en-IN":S.lang, {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }
function catName(cat){ return cat[S.lang]; }
function speak(text){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = S.lang==="hi" ? "hi-IN" : S.lang==="mr" ? "mr-IN" : "en-IN";
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function getGeo(cb){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>cb({lat:pos.coords.latitude, lng:pos.coords.longitude}),
      ()=>cb({lat:FALLBACK_GEO.lat+(Math.random()-0.5)*0.01, lng:FALLBACK_GEO.lng+(Math.random()-0.5)*0.01}),
      {timeout:2500}
    );
  } else cb({lat:FALLBACK_GEO.lat, lng:FALLBACK_GEO.lng});
}
function resizeImage(file, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const w = 260, h = Math.round(img.height*(260/img.width));
      const canvas = document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      cb(canvas.toDataURL("image/jpeg",0.55));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============ Render: shell ============ */
function render(){
  renderTopbar();
  renderBottomnav();
  renderView();
  renderControls();
}

function renderTopbar(){
  const s = STR[S.lang];
  const el = document.getElementById("topbar");
  el.innerHTML = `
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark">♻️</div>
        <div class="brand-name">${s.appName}<small>${s.tagline}</small></div>
      </div>
      <div class="lang-switch">
        ${["en","hi","mr"].map(l=>`<button data-lang="${l}" class="${S.lang===l?'active':''}">${l.toUpperCase()}</button>`).join("")}
      </div>
    </div>
    ${S.role==="collector" ? `
    <div class="conn-row">
      <div class="conn-left"><span class="dot ${S.online?'on':'off'}"></span>${S.online? s.online : s.offline}</div>
      <div class="toggle ${S.online?'on':''}" id="connToggle"><div class="toggle-knob"></div></div>
    </div>` : `
    <div class="conn-row"><div class="conn-left">🏭 ${RECYCLER.name} · ${RECYCLER.area}</div></div>
    `}
  `;
  el.querySelectorAll("[data-lang]").forEach(b=> b.onclick = ()=>{ S.lang=b.dataset.lang; render(); });
  const ct = document.getElementById("connToggle");
  if(ct) ct.onclick = toggleOnline;
}

function toggleOnline(){
  const wasOffline = !S.online;
  S.online = !S.online;
  if(S.online && wasOffline){
    let lots = loadLots();
    const queued = lots.filter(l=>l.status==="queued");
    if(queued.length){
      lots = lots.map(l=> l.status==="queued" ? {...l, status:"listed"} : l);
      saveLots(lots);
    }
  }
  render();
}

function renderBottomnav(){
  const s = STR[S.lang];
  const el = document.getElementById("bottomnav");
  const items = S.role==="collector"
    ? [["home","🏠",s.home],["newLot","📷",s.newLotNav],["price","💰",s.priceNav],["ledger","📒",s.ledgerNav]]
    : [["dash","📋",s.dashNav],["payments","💳",s.paymentsNav]];
  el.innerHTML = items.map(([id,em,label])=>
    `<button class="navbtn ${S.view===id?'active':''}" data-nav="${id}"><span class="em">${em}</span><span>${label}</span></button>`
  ).join("");
  el.querySelectorAll("[data-nav]").forEach(b=> b.onclick=()=>{ S.view=b.dataset.nav; S.draft=null; render(); });
}

function renderView(){
  const el = document.getElementById("view");
  if(S.role==="collector"){
    if(S.view==="home") el.innerHTML = homeHTML();
    else if(S.view==="newLot") el.innerHTML = newLotHTML();
    else if(S.view==="saved") el.innerHTML = savedHTML();
    else if(S.view==="price") el.innerHTML = priceHTML();
    else if(S.view==="ledger") el.innerHTML = ledgerHTML();
    else if(S.view==="safety") el.innerHTML = safetyHTML();
    else if(S.view==="lotDetail") el.innerHTML = lotDetailHTML(S.openLotId);
  } else {
    if(S.view==="dash") el.innerHTML = dashHTML();
    else if(S.view==="payments") el.innerHTML = paymentsHTML();
    else if(S.view==="lotDetail") el.innerHTML = lotDetailHTML(S.openLotId, true);
  }
  bindViewEvents();
}

    <div class="back-row"><div class="back-btn" data-go="home">←</div><h1>${s.newLotTitle}</h1></div>

    </div>
    <button class="btn btn-primary" data-go="ledger" style="margin-bottom:10px;">${s.viewLots}</button>
    <button class="btn btn-outline" data-go="newLot" data-clear="1">${s.addAnother}</button>
  `;
}

/* ============ Collector: Price board ============ */
function priceHTML(){
  const s = STR[S.lang];
  return `
    <div class="back-row"><div class="back-btn" data-go="home">←</div><h1>${s.priceTitle}</h1></div>
    <div style="font-size:11.5px;color:var(--muted);margin-bottom:14px;">${s.priceSub}</div>
    ${CATEGORIES.map(c=>`
      <div class="price-row">
        <div class="em">${c.em}</div>
        <div class="mid"><b>${catName(c)}</b><div class="trend ${c.trend}">${c.trend==='up'?'▲':'▼'} ${c.trend==='up'?'Rising':'Falling'}</div></div>
        <div class="rate">${fmtMoney(c.rate)}${s.perKg}</div>
        <button class="listen" data-speak="${catName(c)}, ${c.rate} ${s.perKg.replace('/','per ')}">🔊</button>
      </div>
    `).join("")}
  `;
}

/* ============ Collector: Ledger ============ */
function ledgerHTML(){
  const s = STR[S.lang];
  const lots = loadLots().slice().sort((a,b)=>b.ts-a.ts);
  const totalPaid = lots.filter(l=>l.status==="paid").reduce((a,l)=>a+(l.offer||l.est),0);
  const pending = lots.filter(l=>l.status==="confirmed"||l.status==="listed"||l.status==="queued").reduce((a,l)=>a+(l.offer||l.est),0);
  return `
    <div class="back-row"><div class="back-btn" data-go="home">←</div><h1>${s.myLotsTitle}</h1></div>
    <div class="strip" style="margin-bottom:16px;">
      <div><div class="amt">${fmtMoney(totalPaid)}</div><div class="lab">${s.totalEarned}</div></div>
      <div><div class="amt">${fmtMoney(pending)}</div><div class="lab">${s.pendingDues}</div></div>
    </div>
    ${lots.length===0 ? `<div class="empty"><span class="em">📦</span>${s.noLots}<br><span style="font-size:11px;">${s.noLotsSub}</span></div>` :
      lots.map(l=>lotRowHTML(l)).join("")}
  `;
}
function lotRowHTML(l){
  const s = STR[S.lang];
  const cat = CATEGORIES.find(c=>c.id===l.catId);
  return `
    <div class="lot-row" data-open="${l.id}">
      <div class="em">${cat.em}</div>
      <div class="mid"><b>${catName(cat)}</b><span>${l.weight.toFixed(1)} kg · ${fmtTs(l.ts)}</span></div>
      <div style="text-align:right;">
        <div class="amt">${fmtMoney(l.offer||l.est)}</div>
        <span class="chip ${l.status}">${s["status"+l.status[0].toUpperCase()+l.status.slice(1)]}</span>
      </div>
    </div>
  `;
}

/* ============ Collector: Safety ============ */
function safetyHTML(){
  const s = STR[S.lang];
  const tips = [["🔥",s.s1t,s.s1b],["🔋",s.s2t,s.s2b],["📺",s.s3t,s.s3b],["🧪",s.s4t,s.s4b]];
  return `
    <div class="back-row"><div class="back-btn" data-go="home">←</div><h1>${s.safetyTitle}</h1></div>
    <div style="font-size:11.5px;color:var(--muted);margin-bottom:14px;">${s.safetySub}</div>
    ${tips.map(([em,title,body])=>`
      <div class="safety-card">
        <div class="em">${em}</div>
        <div>
          <b>${title}</b><p>${body}</p>
          <button class="listen" style="width:auto;padding:5px 12px;border-radius:20px;" data-speak="${title}. ${body}">🔊 ${S.lang==='en'?'Listen':S.lang==='hi'?'सुनें':'ऐका'}</button>
        </div>
      </div>
    `).join("")}
  `;
}

/* ============ Lot detail / handover record (shared) ============ */
function lotDetailHTML(id, isRecycler){
  const s = STR[S.lang];
  const lot = loadLots().find(l=>l.id===id);
  if(!lot) return `<div class="empty">Not found</div>`;
  const cat = CATEGORIES.find(c=>c.id===lot.catId);
  const stepIndex = {queued:0, listed:1, confirmed:3, paid:4}[lot.status];
  const steps = [s.stStep1, s.stStep2, s.stStep3, s.stStep4, s.stStep5];
  return `
    <div class="back-row"><div class="back-btn" data-go="${isRecycler?'dash':'ledger'}">←</div><h1>${s.recordTitle}</h1></div>

    <div class="ref-box">
      <small>${s.refId}</small>
      <div class="ref">${lot.id}</div>
      <span class="chip ${lot.status}" style="margin-top:8px;">${s["status"+lot.status[0].toUpperCase()+lot.status.slice(1)]}</span>
    </div>

    <div class="stepper-status">
      ${steps.map((label,i)=>`<div class="st ${i<=stepIndex?'done':''}"><div class="dotc"></div><span>${label}</span></div>`).join("")}
    </div>

    <div class="kv"><b>${s.material}</b><span>${cat.em} ${catName(cat)}</span></div>
    <div class="kv"><b>${s.weight}</b><span>${lot.weight.toFixed(1)} kg</span></div>
    <div class="kv"><b>${s.condition}</b><span>${s["cond"+lot.condId[0].toUpperCase()+lot.condId.slice(1)]}</span></div>
    <div class="kv"><b>${s.estimated}</b><span>${fmtMoney(lot.est)}</span></div>
    ${lot.offer!=null ? `<div class="kv"><b>${s.offered}</b><span>${fmtMoney(lot.offer)}</span></div>` : ""}
    <div class="kv"><b>${s.timestamp}</b><span>${fmtTs(lot.ts)}</span></div>
    <div class="kv"><b>${s.location}</b><span>${lot.geo.lat.toFixed(4)}, ${lot.geo.lng.toFixed(4)}</span></div>
    ${lot.recycler ? `<div class="kv"><b>${s.recycler}</b><span>${lot.recycler}</span></div>` : ""}

    ${isRecycler && lot.status==="listed" ? `
      <label style="font-size:11px;font-weight:700;color:var(--muted);">${s.yourOffer}</label>
      <input type="number" class="offer-input" id="offerInput" value="${lot.est}">
      <button class="btn btn-primary" id="confirmBtn" style="margin-top:6px;">${s.confirmBtn}</button>
    ` : ""}
    ${isRecycler && lot.status==="confirmed" ? `
      <button class="btn btn-primary" id="markPaidBtn" style="margin-top:14px;">${s.markPaidBtn}</button>
    ` : ""}
  `;
}

/* ============ Recycler: Dashboard ============ */
function dashHTML(){
  const s = STR[S.lang];
  const lots = loadLots();
  const incoming = lots.filter(l=>l.status==="listed").sort((a,b)=>b.ts-a.ts);
  const weekLots = lots.filter(l=>l.status==="confirmed"||l.status==="paid");
  const weekKg = weekLots.reduce((a,l)=>a+l.weight,0);
  const pendingPayout = lots.filter(l=>l.status==="confirmed").reduce((a,l)=>a+(l.offer||l.est),0);
  return `
    <div class="greet">${RECYCLER.name}</div>
    <div class="subgreet">✅ ${s.dashFacility} · ${RECYCLER.cpcb}</div>
    <div class="stat-strip">
      <div><div class="n">${weekLots.length}</div><div class="l">${s.statLots}</div></div>
      <div><div class="n">${weekKg.toFixed(1)}</div><div class="l">${s.statWeight}</div></div>
      <div><div class="n">${fmtMoney(pendingPayout)}</div><div class="l">${s.statPending}</div></div>
    </div>
    <h2 class="sec">${s.incoming}</h2>
    ${incoming.length===0 ? `<div class="empty"><span class="em">📭</span>${s.noIncoming}<br><span style="font-size:11px;">${s.noIncomingSub}</span></div>` :
      incoming.map(l=>lotRowHTML(l)).join("")}
  `;
}

/* ============ Recycler: Payments ============ */
function paymentsHTML(){
  const s = STR[S.lang];
  const lots = loadLots().filter(l=>l.status==="confirmed"||l.status==="paid").sort((a,b)=>b.ts-a.ts);
  return `
    <div class="greet">${s.paymentsTitle}</div>
    <div class="subgreet">&nbsp;</div>
    ${lots.length===0 ? `<div class="empty"><span class="em">💳</span>${s.noPayments}</div>` :
      lots.map(l=>lotRowHTML(l)).join("")}
  `;
}

/* ============ Controls panel ============ */
function renderControls(){
  document.getElementById("ctrlTitle").textContent =
    S.lang==="hi" ? "डेमो नियंत्रण" : S.lang==="mr" ? "डेमो नियंत्रणे" : "Demo controls";
  document.getElementById("ctrlPerspective").textContent =
    S.lang==="hi" ? "परिप्रेक्ष्य" : S.lang==="mr" ? "दृष्टिकोन" : "Perspective";
  const c = document.getElementById("roleCollectorBtn");
  const r = document.getElementById("roleRecyclerBtn");
  c.classList.toggle("active", S.role==="collector");
  r.classList.toggle("active", S.role==="recycler");
  c.onclick = ()=>{ S.role="collector"; S.view="home"; render(); };
  r.onclick = ()=>{ S.role="recycler"; S.view="dash"; render(); };
  document.getElementById("resetBtn").onclick = ()=>{
    if(confirm("Reset all demo data?")){ seedIfEmpty(true); S.view = S.role==="collector"?"home":"dash"; render(); }
  };
}

/* ============ Event binding for dynamic view content ============ */
function bindViewEvents(){
  const view = document.getElementById("view");
  view.querySelectorAll("[data-go]").forEach(el=> el.onclick = ()=>{
    if(el.dataset.clear) S.draft = null;
    S.view = el.dataset.go; render();
  });
  view.querySelectorAll("[data-open]").forEach(el=> el.onclick = ()=>{
    S.openLotId = el.dataset.open; S.view = "lotDetail"; render();
  });
  view.querySelectorAll("[data-speak]").forEach(el=> el.onclick = ()=> speak(el.dataset.speak));

  // New lot form interactions
  const photoBox = document.getElementById("photoBox");
  const photoInput = document.getElementById("photoInput");
  if(photoBox){
    photoBox.onclick = ()=> photoInput.click();
    photoInput.onchange = e=>{
      const f = e.target.files[0];
      if(f) resizeImage(f, dataUrl=>{ S.draft.photo = dataUrl; render(); });
    };
  }
  view.querySelectorAll("[data-cat]").forEach(el=> el.onclick=()=>{ S.draft.catId = el.dataset.cat; render(); });
  view.querySelectorAll("[data-cond]").forEach(el=> el.onclick=()=>{ S.draft.condId = el.dataset.cond; render(); });
  view.querySelectorAll("[data-wt]").forEach(el=> el.onclick=()=>{
    const delta = parseFloat(el.dataset.wt);
    S.draft.weight = Math.max(0.5, Math.round((S.draft.weight+delta)*10)/10);
    render();
  });
  const saveBtn = document.getElementById("saveLotBtn");
  if(saveBtn) saveBtn.onclick = ()=>{
    if(!S.draft.catId) return;
    getGeo(geo=>{
      const cat = CATEGORIES.find(c=>c.id===S.draft.catId);
      const cond = CONDITIONS.find(c=>c.id===S.draft.condId);
      const est = Math.round(cat.rate*S.draft.weight*cond.mult);
      const ts = Date.now();
      const lot = {
        id: "KC-"+ts.toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,5).toUpperCase(),
        catId: S.draft.catId, condId: S.draft.condId, weight: S.draft.weight, est,
        offer: null, status: S.online ? "listed" : "queued",
        photo: S.draft.photo, ts, geo, recycler: null, confirmedTs:null, paidTs:null,
      };
      const lots = loadLots(); lots.push(lot); saveLots(lots);
      S.draft = null; S.view = "saved"; render();
    });
  };

  // Recycler lot detail actions
  const confirmBtn = document.getElementById("confirmBtn");
  if(confirmBtn) confirmBtn.onclick = ()=>{
    const offerVal = parseFloat(document.getElementById("offerInput").value) || 0;
    getGeo(geo=>{
      let lots = loadLots();
      lots = lots.map(l=> l.id===S.openLotId ? {...l, status:"confirmed", offer:offerVal, recycler:RECYCLER.name, confirmedTs:Date.now(), geo} : l);
      saveLots(lots); render();
    });
  };
  const markPaidBtn = document.getElementById("markPaidBtn");
  if(markPaidBtn) markPaidBtn.onclick = ()=>{
    let lots = loadLots();
    lots = lots.map(l=> l.id===S.openLotId ? {...l, status:"paid", paidTs:Date.now()} : l);
    saveLots(lots); render();
  };
}

/* ============ Init ============ */
seedIfEmpty(false);
render();
</script>
</body>
</html>
